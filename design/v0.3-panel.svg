<text x="1150" y="821" text-anchor="middle" class="muted">確認線材接穩，並保持平板解鎖。</text><text x="1150" y="848" text-anchor="middle" class="muted">恢復後會重新同步完整畫面，再繼續接收筆輸入。</text>
<rect x="1024" y="883" width="120" height="42" rx="8" fill="#d2b181"/><text x="1084" y="910" text-anchor="middle" font-size="16" style="fill:#252323">立即重試</text><text x="1223" y="910" text-anchor="middle" font-size="16">返回連線頁</text>
