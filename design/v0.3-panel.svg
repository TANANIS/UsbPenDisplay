<text x="48" y="836" class="label" font-weight="600">電腦端連線狀態</text>
<rect x="48" y="858" width="700" height="127" rx="12" fill="#20232b"/>
<circle cx="76" cy="888" r="5" fill="#999eaa"/><text x="92" y="894" class="small">等待接線</text><path d="M174 888h22" stroke="#5d6270"/><circle cx="220" cy="888" r="5" fill="#d2b181"/><text x="236" y="894" class="small">連線／同步中</text><path d="M354 888h22" stroke="#5d6270"/><circle cx="400" cy="888" r="5" fill="#90c5aa"/><text x="416" y="894" class="small">可以繪圖</text>
<text x="72" y="928" class="small muted">拔線：釋放筆 → 等待裝置 → 修復連線 → 完整同步 → 恢復輸入</text><text x="72" y="957" class="small muted">需要操作時說明原因：請解鎖／允許 USB 連線／開啟平板 App</text>
<text x="48" y="1032" class="small muted">UI 原則：主要畫面不展示 ADB、session token、編碼器等實作細節；診斷資料集中於進階區。</text>
