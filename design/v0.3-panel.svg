<rect x="82" y="496" width="207" height="40" rx="6" fill="#434047" stroke="#d2b181"/><text x="185" y="522" text-anchor="middle" font-size="16" fill="#ead0aa">流暢　1280</text><text x="397" y="522" text-anchor="middle" class="muted">清晰　1600</text><text x="610" y="522" text-anchor="middle" class="muted">原始解析度</text>
