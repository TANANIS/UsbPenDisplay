<text x="48" y="54" font-size="15" letter-spacing="3" fill="#bca47a">USB PEN DISPLAY / PANEL STUDY 01</text>
<text x="48" y="101" font-size="32" font-weight="600">插上，連線，開始畫。</text>
<text x="48" y="133" class="muted">v0.3 提案 · 電腦管理連線，平板保留繪圖空間 · 此圖為介面草稿</text>
